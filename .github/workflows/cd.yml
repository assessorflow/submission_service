name: CD — Push to Artifact Registry + DAST

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: aflow-491809
  GCP_REGION: asia-southeast1
  AR_REPO: submission-service
  SERVICE_NAME: submission-service
  IMAGE: asia-southeast1-docker.pkg.dev/aflow-491809/submission-service/submission-service

jobs:
  # ================================================================
  # Stage 1: Build + Push to Artifact Registry
  # ================================================================
  push:
    name: Build + Push to Artifact Registry
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract version tag
        id: version
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Build and push to Artifact Registry
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.version.outputs.date }}-${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image URL
        run: |
          echo "Pushed: ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}"
          echo "Pushed: ${{ env.IMAGE }}:latest"

  # ================================================================
  # Stage 2: DAST — Run ZAP against the actual deployed container
  # ================================================================
  dast:
    name: DAST — ZAP Baseline Scan
    runs-on: ubuntu-latest
    needs: [push]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assessorflow
          POSTGRES_PASSWORD: assessorflow_prod
          POSTGRES_DB: af_submission
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U assessorflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Apply DDL to test DB
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=assessorflow_prod psql -h localhost -p 15433 -U assessorflow -d af_submission -f reference/ddl.sql

      - name: Pull and run the actual container from Artifact Registry
        run: |
          docker pull ${{ env.IMAGE }}:${{ needs.push.outputs.image-tag }}
          docker run -d --name submission-service \
            --network host \
            -e SS_DB_HOST=localhost \
            -e SS_DB_PORT=15433 \
            -e SS_DB_NAME=af_submission \
            -e SS_DB_USER=assessorflow \
            -e SS_DB_PASSWORD=assessorflow_prod \
            -e GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            ${{ env.IMAGE }}:${{ needs.push.outputs.image-tag }}

      - name: Wait for service to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8060/health; then
              echo "Service is ready"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8060"
          rules_file_name: ""
          cmd_options: "-a -j"
          allow_issue_writing: false

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: report_html.html

      - name: Show container logs on failure
        if: failure()
        run: docker logs submission-service