name: CI — Submission Service

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  SERVICE_NAME: submission-service

jobs:
  # ================================================================
  # Stage 1: Lint + Type Check
  # ================================================================
  lint:
    name: Lint — Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  # ================================================================
  # Stage 2: SAST — Static Application Security Testing
  # ================================================================
  sast-bandit:
    name: SAST — Bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install bandit
        run: pip install bandit[toml]

      - name: Run Bandit (Python SAST)
        run: bandit -r src/ -f json -o bandit-report.json --severity-level medium || true

      - name: Print Bandit summary
        if: always()
        run: bandit -r src/ --severity-level medium || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  sca:
    name: SCA — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies + pip-audit
        run: |
          pip install pip-audit
          pip install .

      - name: Run pip-audit (dependency vulnerability scan)
        run: pip-audit --format=json -o pip-audit-results.json || true

      - name: Print pip-audit results
        if: always()
        run: pip-audit || true

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: pip-audit-results.json

  secret-scan:
    name: Secret Scanning — TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  # ================================================================
  # Stage 3: Unit Tests
  # ================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assessorflow
          POSTGRES_PASSWORD: assessorflow_prod
          POSTGRES_DB: af_submission
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U assessorflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ".[dev]"
          pip install pytest-cov

      - name: Generate gRPC stubs
        run: |
          mkdir -p grpc-stubs
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=grpc-stubs \
            --grpc_python_out=grpc-stubs \
            assessorflow/submission/v1/submission.proto
          find grpc-stubs -type d -exec touch {}/__init__.py \;

      - name: Apply DDL
        run: PGPASSWORD=assessorflow_prod psql -h localhost -p 15433 -U assessorflow -d af_submission -f reference/ddl.sql

      - name: Run unit tests
        env:
          SS_DB_HOST: localhost
          SS_DB_PORT: "15433"
          SS_DB_NAME: af_submission
          SS_DB_USER: assessorflow
          SS_DB_PASSWORD: assessorflow_prod
          PYTHONPATH: src:grpc-stubs
        run: >
          python -m pytest tests/test_rest_endpoints.py
          -v
          --cov=submission_service
          --cov-report=xml
          --cov-report=term-missing
          --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml

  # ================================================================
  # Stage 4: Integration + E2E Tests (real DB + real Pub/Sub)
  # ================================================================
  integration-tests:
    name: Integration + E2E Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: assessorflow
          POSTGRES_PASSWORD: assessorflow_prod
          POSTGRES_DB: af_submission
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U assessorflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          pip install ".[dev]"
          pip install pytest-cov

      - name: Generate gRPC stubs
        run: |
          mkdir -p grpc-stubs
          python -m grpc_tools.protoc \
            -Iproto \
            --python_out=grpc-stubs \
            --grpc_python_out=grpc-stubs \
            assessorflow/submission/v1/submission.proto
          find grpc-stubs -type d -exec touch {}/__init__.py \;

      - name: Apply DDL
        run: PGPASSWORD=assessorflow_prod psql -h localhost -p 15433 -U assessorflow -d af_submission -f reference/ddl.sql

      - name: Run E2E workflow tests
        env:
          SS_DB_HOST: localhost
          SS_DB_PORT: "15433"
          SS_DB_NAME: af_submission
          SS_DB_USER: assessorflow
          SS_DB_PASSWORD: assessorflow_prod
          GCP_PROJECT_ID: aflow-491809
          PYTHONPATH: src:grpc-stubs
        run: >
          python -m pytest tests/test_workflow_e2e.py
          -v
          --cov=submission_service
          --cov-report=xml
          --cov-report=term-missing
          --tb=short

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: coverage.xml

  # ================================================================
  # Stage 5: Build Container + Container Security Scan
  # ================================================================
  build:
    name: Build + Container Scan
    runs-on: ubuntu-latest
    needs: [unit-tests, sast-bandit, sca, secret-scan]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Trivy container scan (SAST for containers)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.SERVICE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: "CRITICAL"

